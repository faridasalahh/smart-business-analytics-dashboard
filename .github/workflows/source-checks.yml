name: Source and smoke tests

on:
  push:
    branches: [main, security-and-release-fixes]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check Python syntax
        run: python -m compileall -q backend launch.py tests
      - name: Check JavaScript syntax
        run: node --check frontend/js/app.js
      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest httpx
      - name: Run backend smoke and security regression tests
        run: python -m pytest -q
