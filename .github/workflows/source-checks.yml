name: Source checks

on:
  push:
    branches: [main, security-and-release-fixes]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check Python syntax
        run: python -m compileall -q backend launch.py
      - name: Check JavaScript syntax
        run: node --check frontend/js/app.js
